name: Deploy game to GitHub Pages

# Deploys the single-file game build as the repo's GitHub Pages site.
# Note: Pages requires the repository to be PUBLIC on the free plan.
on:
  workflow_dispatch:
  push:
    branches: [claude/3d-browser-game-jspqml]
    paths: [dist/**, .github/workflows/pages.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site
          cp dist/after-hours.html _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
